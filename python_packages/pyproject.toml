[project]
name = "af-aidevs"
version = "0.1.6"
description = "Shared Python packages for AI_Devs course"
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "google-cloud-bigquery==3.41.0",
    "httpx==0.28.1",
    "python-frontmatter==1.1.0",
    "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["af_aidevs"]
