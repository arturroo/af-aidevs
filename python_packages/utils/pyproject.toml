[project]
name = "af-aidevs-utils"
version = "0.1.0"
description = "Private Python utilities for AI_Devs"
requires-python = "==3.13.5"
dependencies = [
    "pydantic==2.13.4",
    "python-frontmatter==1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

