[project]
name = "cr-s02e03-failure"
version = "0.1.0"
description = "S02E03: Power plant failure log compressor and autonomous technician feedback remediation service"
requires-python = "==3.13.5"
dependencies = [
    "af-aidevs==0.2.1",
    "fastapi==0.136.1",
    "fastmcp==3.2.4",
    "google-cloud-bigquery==3.41.0",
    "google-cloud-storage==3.1.0",
    "google-genai==1.74.0",
    "httpx==0.28.1",
    "langchain==1.2.15",
    "langchain-google-genai==4.2.2",
    "langchain-mcp-adapters==0.2.2",
    "langfuse==2.57.0",
    "pydantic==2.13.4",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "python-dotenv==1.2.2",
    "python-frontmatter==1.1.0",
    "tenacity==9.0.0",
    "tiktoken==0.9.0",
    "tzdata==2026.2",
    "uvicorn==0.46.0",
]

[[tool.uv.index]]
name = "gar"
url = "https://europe-west6-python.pkg.dev/af-aidevs/python-packages/simple/"
explicit = true

[tool.uv.sources]
af-aidevs = { index = "gar" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
