[project]
name = "s01e04-task"
version = "0.1.0"
description = "S01E04 Task: sendit - Multimodal Documentation Analysis"
requires-python = "==3.12.11"
dependencies = [
    "langchain==1.2.15",
    "langchain-google-genai==4.2.2",
    "google-genai==1.74.0",
    "pydantic==2.9.2",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "google-cloud-bigquery==3.41.0",
    "python-frontmatter==1.1.0",
    "tzdata==2025.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
